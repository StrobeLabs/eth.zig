[package]
name = "alloy-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
alloy-primitives = { version = "1.6", features = ["rlp"] }
alloy-rlp = "0.3"
alloy-rlp-derive = "0.3"
alloy-sol-types = "1.6"
alloy-dyn-abi = "1.6"
alloy-consensus = "2.0"
alloy-signer = "2.0"
alloy-signer-local = "2.0"
alloy-network = "2.0"
k256 = { version = "0.13", features = ["ecdsa"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "eth_comparison"
harness = false

[[bench]]
name = "u256_comparison"
harness = false
